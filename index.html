<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0B101B" />
    <meta name="description" content="Orbit Sling — a minimalist 60fps orbital slingshot arcade game built with TypeScript, HTML5 Canvas, and procedural Web Audio." />
    <title>Orbit Sling</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B101B'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%2338BDF8' stroke-width='2.5' stroke-dasharray='6 4'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%2338BDF8'/%3E%3Ccircle cx='50' cy='24' r='4.5' fill='%23F5B841'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas" aria-label="Orbit Sling game canvas"></canvas>

      <!-- Minimal Telemetry HUD -->
      <header class="hud" aria-label="Game telemetry">
        <div class="hud-left">
          <div class="stat-block">
            <span class="stat-label">SCORE</span>
            <span id="hud-score" class="stat-value">0</span>
          </div>
          <div class="stat-block stat-block--muted">
            <span class="stat-label">BEST</span>
            <span id="hud-best" class="stat-value">0</span>
          </div>
        </div>

        <div class="hud-center">
          <div id="hud-combo" class="combo-badge" aria-live="polite" hidden>
            <span class="combo-prefix">COMBO</span>
            <span id="hud-combo-val" class="combo-value">x2</span>
          </div>
        </div>

        <div class="hud-right">
          <button
            id="btn-restart"
            class="icon-btn"
            type="button"
            title="Restart (R)"
            aria-label="Restart game"
          >
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
              <path d="M3 3v5h5" />
            </svg>
          </button>
          <button
            id="btn-mute"
            class="icon-btn"
            type="button"
            title="Toggle sound (M)"
            aria-label="Toggle sound"
            aria-pressed="false"
          >
            <svg id="icon-sound-on" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
            </svg>
            <svg id="icon-sound-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
              <line x1="22" y1="9" x2="16" y2="15" />
              <line x1="16" y1="9" x2="22" y2="15" />
            </svg>
          </button>
        </div>
      </header>

      <!-- Non-blocking Title / First-Run Hint -->
      <div id="start-overlay" class="start-overlay" aria-hidden="false">
        <div class="title-lockup">
          <div class="title-kicker">ORBITAL TELEMETRY // 01</div>
          <h1 class="title-heading">ORBIT SLING</h1>
        </div>
        <div class="start-hint">
          <span class="hint-dot"></span>
          <span>Drag anywhere to sling</span>
        </div>
      </div>

      <!-- Game Over Overlay -->
      <section id="gameover-overlay" class="gameover-overlay" role="dialog" aria-modal="true" aria-labelledby="gameover-title" hidden>
        <div class="gameover-card">
          <div id="gameover-reason" class="gameover-reason">SIGNAL LOST</div>
          <h2 id="gameover-title" class="gameover-title">RUN TERMINATED</h2>

          <div class="gameover-stats">
            <div class="go-stat">
              <span class="go-stat-label">SCORE</span>
              <span id="go-score" class="go-stat-value">0</span>
            </div>
            <div class="go-stat">
              <span class="go-stat-label">BEST <span id="go-new-best" class="new-badge" hidden>NEW</span></span>
              <span id="go-best" class="go-stat-value go-stat-value--gold">0</span>
            </div>
            <div class="go-stat">
              <span class="go-stat-label">MAX COMBO</span>
              <span id="go-max-combo" class="go-stat-value go-stat-value--cyan">x1</span>
            </div>
          </div>

          <button id="btn-play-again" class="primary-btn" type="button">
            Play Again
            <span class="key-hint">R</span>
          </button>

          <footer class="gameover-footer">
            <span>Built by</span>
            <a href="https://angelo-palpalatoc.vercel.app/" target="_blank" rel="noopener noreferrer">Angelo Palpalatoc</a>
            <span class="footer-sep" aria-hidden="true">·</span>
            <a href="https://github.com/Angelo-Palpalatoc" target="_blank" rel="noopener noreferrer">GitHub</a>
          </footer>
        </div>
      </section>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
