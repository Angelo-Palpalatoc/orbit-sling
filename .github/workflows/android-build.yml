name: Build Android APK & AAB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - '.github/workflows/android-build.yml'

jobs:
  android:
    name: Build Offline Capacitor Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle 8.14.3 & cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & build web bundle
        run: npm run build

      - name: Sync web bundle into Capacitor Android project
        run: npx cap sync android

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Verify Gradle wrapper version
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Build installable offline APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build Play Store App Bundle (unsigned release AAB)
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Upload Orbit Sling APK
        uses: actions/upload-artifact@v4
        with:
          name: orbit-sling-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Orbit Sling Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: orbit-sling-playstore-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
